spring:
  application:
    name: hs-spring-async-content-creation

  datasource:
    url: jdbc:postgresql://localhost:5432/test_db
    username: user
    password: pass

  flyway:
    enabled: true
    schemas: content_creation
    createSchemas: true
    baselineOnMigrate: true
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  threads:
    virtual:
      enabled: false

  webflux:
    basePath: /api

server:
  port: 8081

logging:
  level:
    com:
      yatskevich: DEBUG
